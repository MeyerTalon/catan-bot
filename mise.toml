min_version = "2026.0.0"

[tools]
python = "3.11"
node = "22"
# aqua still looks for pnpm-macos-* on pnpm 11; github release assets use darwin-*.
"github:pnpm/pnpm" = "11.20.0"
uv = "0.11.29"
terraform = "1.16"
tflint = "0.59"

[settings]
lockfile = true

# activate the uv workspace venv in shells that use `mise activate`
[env]
_.python.venv = ".venv"

# --- install ---

[tasks.install]
description = "Install backend, frontend, and bot dependencies"
depends = ["sync", "fe:install"]

# one uv workspace (root pyproject.toml + backend member): one uv.lock, one .venv
[tasks.sync]
description = "Sync the shared uv env (bot + backend, all groups) from the lockfile"
run = "uv sync --frozen --all-packages --all-groups"

[tasks."fe:install"]
description = "Install frontend deps from the pnpm lockfile"
dir = "frontend"
run = "pnpm install --frozen-lockfile"

# --- backend ---

[tasks."be:dev"]
description = "Run the FastAPI server with reload"
dir = "backend"
run = "uv run uvicorn app.main:create_app --factory --reload"

[tasks."be:compile"]
description = "Byte-compile backend Python"
dir = "backend"
run = "uv run python -m compileall app tests scripts"

[tasks."be:format"]
description = "Format backend Python with ruff"
dir = "backend"
run = "uv run ruff format app tests scripts"

[tasks."be:format-check"]
description = "Check backend Python formatting"
dir = "backend"
run = "uv run ruff format --check app tests scripts"

[tasks."be:lint"]
description = "Lint backend Python with ruff"
dir = "backend"
run = "uv run ruff check app tests scripts"

[tasks."be:typecheck"]
description = "Type-check backend Python with mypy"
dir = "backend"
run = "uv run mypy"

[tasks."be:test"]
description = "Run backend unit tests"
dir = "backend"
run = "uv run pytest"

[tasks."be:check"]
description = "Compile, ruff, mypy, and pytest"
depends = ["be:compile", "be:format-check", "be:lint", "be:typecheck", "be:test"]

[tasks."be:migrate"]
description = "Apply Alembic migrations"
dir = "backend"
run = "uv run alembic -c ../db/alembic.ini upgrade head"

[tasks."be:openapi"]
description = "Export FastAPI OpenAPI schema for the frontend"
dir = "backend"
run = "uv run python scripts/export_openapi.py"


# --- local e2e stack (docker-compose.yml: postgres + moto + backend + edge) ---

[tasks."dev:up"]
description = "Start the local stack: create the Cognito pool in moto, build, run, wait for healthy"
run = """
docker compose run --rm cognito-local-init
docker compose up -d --build --wait
echo "app      http://localhost:${EDGE_PORT:-8080}"
echo "api      http://localhost:${EDGE_PORT:-8080}/api  (direct: http://localhost:${BACKEND_PORT:-8000}/docs)"
echo "moto     http://localhost:${MOTO_PORT:-5001}/moto-api/"
echo "postgres postgresql://catan:catan@localhost:${POSTGRES_PORT:-5432}/catan"
"""

[tasks."dev:down"]
description = "Stop the local stack and delete its state (postgres data, moto users)"
run = "docker compose down --volumes --remove-orphans"

[tasks."dev:logs"]
description = "Follow logs from the local stack"
run = "docker compose logs -f"

# --- frontend ---

[tasks."fe:dev"]
description = "Run the Vite dev server"
dir = "frontend"
run = "pnpm run dev"

[tasks."fe:lint"]
description = "Lint frontend TypeScript with oxlint (warnings fail)"
dir = "frontend"
run = "pnpm run lint"

[tasks."fe:format"]
description = "Format frontend files with oxfmt"
dir = "frontend"
run = "pnpm run format"

[tasks."fe:format-check"]
description = "Check frontend formatting with oxfmt"
dir = "frontend"
run = "pnpm run format:check"

[tasks."fe:typecheck"]
description = "Type-check frontend TypeScript (tsc --noEmit)"
dir = "frontend"
run = "pnpm run typecheck"

[tasks."fe:build"]
description = "Build the frontend for production"
dir = "frontend"
run = "pnpm run build"

[tasks."fe:preview"]
description = "Preview the production frontend build"
dir = "frontend"
run = "pnpm run preview"

[tasks."fe:generate-api"]
description = "Regenerate TypeScript types from the committed OpenAPI schema"
dir = "frontend"
run = "pnpm run generate:api"

[tasks.api]
description = "Export OpenAPI and regenerate frontend types"
depends = ["be:openapi"]
dir = "frontend"
run = "pnpm run generate:api"

[tasks."fe:audit"]
description = "Fail on high/critical advisories in production dependencies"
dir = "frontend"
run = "pnpm audit --prod --audit-level=high"

[tasks."fe:check"]
description = "oxfmt --check, oxlint, tsc, and pnpm audit"
depends = ["fe:format-check", "fe:lint", "fe:typecheck", "fe:audit"]

# --- bot ---

[tasks."bot:choose-move"]
description = "Run the catan_bot CLI against the sample game state"
run = "uv run catan-bot choose-move"

# --- docs (mkdocs, published to github pages by docs.yml) ---

[tasks."docs:serve"]
description = "Preview the docs site at http://127.0.0.1:8001"
run = "uv run mkdocs serve -a 127.0.0.1:8001"

[tasks."docs:build"]
description = "Strict mkdocs build into site/"
run = "uv run mkdocs build"

# --- terraform (Makefile remains the implementation) ---

[tasks."tf:check"]
description = "terraform fmt -check + validate every stack and module"
dir = "terraform"
run = "make check"

[tasks."tf:lint"]
description = "Run tflint recursively"
dir = "terraform"
run = "make lint"

[tasks."tf:plan"]
description = "Plan an environment (ENV=prod by default)"
dir = "terraform"
run = "make plan ENV=${ENV:-prod}"

[tasks."tf:apply"]
description = "Apply a saved plan (only when explicitly asked)"
dir = "terraform"
run = "make apply ENV=${ENV:-prod}"

[tasks."tf:bootstrap-apply"]
description = "Apply the one-time bootstrap stack (only when explicitly asked)"
dir = "terraform"
run = "make bootstrap-apply"

# --- meta ---

[tasks.check]
description = "All quality checks: backend (compile, ruff, mypy, pytest), frontend (oxfmt, oxlint, tsc), docs build"
depends = ["be:check", "fe:check", "docs:build"]
