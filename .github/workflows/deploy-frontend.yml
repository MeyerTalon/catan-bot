# Build the React app and publish it to S3 + CloudFront.
# Manual only. Also callable from deploy.yml. Runs in the `production`
# GitHub environment (see deploy-backend.yml).
#
# Environment variables (Settings → Environments → production → Variables):
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, FRONTEND_BUCKET, CLOUDFRONT_DISTRIBUTION_ID,
#   VITE_BACKEND_URL (the terraform `backend_url` output: https://<cloudfront>/api)
name: Deploy frontend

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run fe:install
      - name: Build
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
        run: mise run fe:build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync to S3 and invalidate CloudFront
        run: |
          aws s3 sync frontend/dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" >/dev/null
      - name: Summary
        run: |
          {
            echo "## Frontend deployed"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- bucket: \`${{ vars.FRONTEND_BUCKET }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
