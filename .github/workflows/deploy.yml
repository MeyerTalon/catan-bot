# Deploy backend, then frontend (backend first so the API contract is live
# before the UI that expects it). Manual only.
name: Deploy all

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy through
        type: environment
        default: production

permissions:
  contents: read
  id-token: write

jobs:
  backend:
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: ${{ inputs.environment }}

  frontend:
    needs: backend
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: ${{ inputs.environment }}
