# Deploy backend, then frontend (backend first so the API contract is live
# before the UI that expects it). Manual only.
name: Deploy all

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  backend:
    uses: ./.github/workflows/deploy-backend.yml

  frontend:
    needs: backend
    uses: ./.github/workflows/deploy-frontend.yml
