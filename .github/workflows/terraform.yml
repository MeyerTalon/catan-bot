# Plan, then (optionally) apply terraform/envs/prod. Manual only.
#
# Two GitHub environments are involved, both restricted to the main branch:
#   production-plan  no reviewers — the plan job runs immediately
#   production       required reviewers — the apply job waits for approval,
#                    so you read the plan in the job summary, then approve
# The bootstrap apply role trusts both via OIDC.
#
# Environment variables (set on BOTH environments): AWS_REGION, AWS_TERRAFORM_APPLY_ROLE_ARN
name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: plan only, or plan and (after approval) apply
        type: choice
        options: [plan, plan-and-apply]
        default: plan

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: production-plan
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init
        run: terraform init -backend-config=backend.hcl
      - name: Plan
        run: terraform plan -no-color -out=tfplan | tee plan.txt
      - name: Summary
        run: |
          {
            echo "## terraform plan — prod"
            echo '```'
            grep -E "^Plan:|^No changes" plan.txt || true
            echo '```'
            echo '<details><summary>full plan</summary>'
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      # the plan file contains state values (including the db password);
      # keep it only long enough for the apply job to pick it up
      - uses: actions/upload-artifact@v7
        if: inputs.action == 'plan-and-apply'
        with:
          name: tfplan-prod
          path: terraform/envs/prod/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    if: inputs.action == 'plan-and-apply'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/download-artifact@v8
        with:
          name: tfplan-prod
          path: terraform/envs/prod
      - name: Init
        run: terraform init -backend-config=backend.hcl
      - name: Apply the approved plan
        run: terraform apply -no-color tfplan
