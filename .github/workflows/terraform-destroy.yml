# Destroy every resource in terraform/envs/prod. Manual only.
#
# Same two GitHub environments as terraform.yml:
#   production-plan  the destroy plan runs immediately, summary in the job
#   production       required reviewers — the destroy waits for approval
# The bootstrap stack (state bucket, OIDC, apply role, budget) is not touched.
#
# Prod keeps deletion protection on: RDS (deletion_protection, final snapshot),
# Cognito (deletion_protection) and the frontend bucket (force_destroy = false).
# Flip those in terraform/envs/prod/main.tf and apply them through terraform.yml
# first, otherwise the destroy fails part-way on those resources.
#
# Environment variables (set on BOTH environments): AWS_REGION, AWS_TERRAFORM_APPLY_ROLE_ARN
# Environment secret (set on BOTH, once the prod custom domain is on):
#   CLOUDFLARE_API_TOKEN  DNS edit on that one zone
name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: type "destroy prod" to confirm
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    if: inputs.confirm == 'destroy prod'
    runs-on: ubuntu-latest
    environment: production-plan
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init
        run: terraform init -backend-config=backend.hcl
      - name: Plan destroy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform plan -destroy -no-color -out=tfplan | tee plan.txt
      - name: Summary
        run: |
          {
            echo "## terraform destroy plan — prod"
            echo '```'
            grep -E "^Plan:|^No changes" plan.txt || true
            echo '```'
            echo '<details><summary>full plan</summary>'
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      # the plan file contains state values (including the db password);
      # keep it only long enough for the destroy job to pick it up
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-destroy-prod
          path: terraform/envs/prod/tfplan
          retention-days: 1
          if-no-files-found: error

  destroy:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-destroy-prod
          path: terraform/envs/prod
      - name: Init
        run: terraform init -backend-config=backend.hcl
      - name: Apply the approved destroy plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform apply -no-color tfplan
