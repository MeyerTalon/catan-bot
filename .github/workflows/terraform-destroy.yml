# Destroy every resource in terraform/envs/prod. Manual only.
#
# Same two GitHub environments as terraform.yml:
#   production-plan  the destroy plan runs immediately, summary in the job
#   production       required reviewers — the destroy waits for approval
# The bootstrap stack (state bucket, OIDC, apply role, budget) is not touched.
#
# Prod resources are protected by default (RDS deletion protection + final
# snapshot, Cognito deletion protection, frontend bucket force_destroy off).
# After approval the destroy job applies -var allow_destroy=true to just those
# resources, which lifts the protection, skips the RDS final snapshot and lets
# terraform empty the bucket, then destroys the whole stack in one sweep. All
# data (database, users, uploaded frontend) is gone afterwards. The next
# terraform.yml run (allow_destroy defaults to false) protects them again.
#
# Environment variables (set on BOTH environments): AWS_REGION, AWS_TERRAFORM_APPLY_ROLE_ARN
# Environment secret (set on BOTH, once the prod custom domain is on):
#   CLOUDFLARE_API_TOKEN  DNS edit on that one zone
name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: type "destroy prod" to confirm
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    if: inputs.confirm == 'destroy prod'
    runs-on: ubuntu-latest
    environment: production-plan
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init
        run: terraform init -backend-config=backend.hcl
      # review only: the destroy job re-plans after lifting protection, so a
      # saved plan from here would already be stale
      - name: Plan destroy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform plan -destroy -no-color -var allow_destroy=true | tee plan.txt
      - name: Summary
        run: |
          {
            echo "## terraform destroy plan — prod"
            echo '```'
            grep -E "^Plan:|^No changes" plan.txt || true
            echo '```'
            echo '<details><summary>full plan</summary>'
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init
        run: terraform init -backend-config=backend.hcl
      # destroy reads protection from state, so it has to be lifted there
      # first; -target keeps this apply away from everything else
      - name: Lift deletion protection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          terraform apply -no-color -auto-approve -var allow_destroy=true
          -target=module.database.aws_db_instance.this
          -target=module.auth.aws_cognito_user_pool.this
          -target=module.frontend.aws_s3_bucket.this
      # approval on the production environment is the human gate
      - name: Destroy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform destroy -no-color -auto-approve -var allow_destroy=true
