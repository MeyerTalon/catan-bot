name: CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'db/**'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Sync backend
        run: mise run be:sync
      - name: Check backend
        run: mise run be:check

  openapi-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Sync backend
        run: mise run be:sync
      - name: Install frontend dependencies
        run: mise run fe:install
      - name: Export OpenAPI and regenerate types
        run: mise run api
      - name: Fail if generated API artifacts are stale
        run: git diff --exit-code -- frontend/src/api/openapi.json frontend/src/api/schema.d.ts

  frontend-build:
    needs: openapi-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Install frontend dependencies
        run: mise run fe:install
      - name: Build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
        run: mise run fe:build

  deploy:
    needs:
      - backend-tests
      - frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Apply Alembic migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mise run be:sync
          mise run be:migrate
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push backend image
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          IMAGE="$ECR_REPOSITORY:${{ github.sha }}"
          docker build -f backend/Dockerfile -t "$IMAGE" -t "$ECR_REPOSITORY:latest" backend
          docker push "$IMAGE"
          docker push "$ECR_REPOSITORY:latest"
      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --force-new-deployment
      - name: Build frontend
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
        run: |
          mise run fe:install
          mise run fe:build
      - name: Deploy frontend to S3 and CloudFront
        run: |
          aws s3 sync frontend/dist "s3://${{ secrets.FRONTEND_BUCKET }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
