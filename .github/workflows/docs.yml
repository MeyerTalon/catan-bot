# Build the MkDocs site and publish it to GitHub Pages. This is the one
# workflow that runs automatically on main: it touches nothing but Pages.
# One-time setup: Settings → Pages → Source = "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'AGENTS.md'
      - 'backend/README.md'
      - 'frontend/README.md'
      - 'db/README.md'
      - 'terraform/README.md'
      - 'terraform/ARCHITECTURE.md'
      - 'frontend/src/api/openapi.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run sync
      - name: Build site
        run: mise run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
