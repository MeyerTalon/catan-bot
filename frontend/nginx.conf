# Local stand-in for S3 + CloudFront (terraform/modules/static-site/main.tf).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # cloudfront's /api/* behavior: forward to the backend origin with the
    # prefix stripped (the trailing slash on proxy_pass does the strip)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # cloudfront custom_error_response 403/404 -> /index.html (spa fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
