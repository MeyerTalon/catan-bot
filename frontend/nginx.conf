# Local stand-in for S3 + CloudFront (terraform/modules/static-site/main.tf).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # same headers cloudfront's response headers policy adds, so a csp
    # violation shows up locally before it ships (keep in sync with the
    # content_security_policy default in the static-site module)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # cloudfront's /api/* behavior: forward to the backend origin with the
    # prefix stripped (the trailing slash on proxy_pass does the strip)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # cloudfront spa-fallback function: extensionless paths -> /index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
