[project]
name = "catan-engine"
version = "0.1.0"
description = "Rules engine for Catan: board, game state, and legal-move application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine"]

[tool.setuptools.package-dir]
engine = "src"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0.0",
    "ruff>=0.16.7",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B"]
ignore = [
    "E501",  # line length is enforced by the formatter
    "UP006",
    "UP035",
]

[tool.ruff.lint.isort]
known-first-party = ["engine"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
explicit_package_bases = true
