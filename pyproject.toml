[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catan-bot"
version = "0.1.0"
description = "LLM-driven Catan bot CLI (gpt-oss via Ollama)."
authors = [
  { name = "catan-bot user" }
]
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "requests>=2.31.0",
]

[project.scripts]
catan-bot = "catan_bot.cli:app"

[tool.setuptools]
packages = ["catan_bot"]

# one lockfile and one .venv for the bot (this package) and the backend
[tool.uv.workspace]
members = ["backend"]

[tool.uv]
package = true
