# virtual uv workspace root: one uv.lock and one .venv for every member.
# the members (backend/, engine/) own the actual packages.
[project]
name = "catan-bot"
version = "0.1.0"
description = "Full-stack Catan app with a rules engine."
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["backend", "engine"]

[tool.uv]
package = false

[dependency-groups]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6",
  "mkdocs-include-markdown-plugin>=7.0",
]
