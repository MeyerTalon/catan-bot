# Local testing: build and run the backend in a container.
# From backend/: docker compose up --build
# Requires backend/.env with DATABASE_URL and Cognito settings. The container
# runs Alembic migrations against DATABASE_URL before starting the server.
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    network_mode: host
    environment:
      - PORT=8000
    dns:
      - 8.8.8.8
      - 8.8.4.4
