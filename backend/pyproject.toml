[project]
name = "catan-backend"
version = "0.1.0"
description = "FastAPI backend for Catan app using RDS Postgres and Amazon Cognito."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic[email]>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyjwt[crypto]>=2.14.0",
    "boto3>=1.43.95",
    "alembic>=1.20.0",
]

[project.scripts]
catan-backend = "app.main:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "boto3-stubs[cognito-idp]>=1.43.95",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=8.0.0",
    "ruff>=0.16.7",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["app", "tests", "scripts"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "E501",  # line length is enforced by the formatter
    "UP006",
    "UP035",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
packages = ["app"]
mypy_path = "."
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
explicit_package_bases = true
